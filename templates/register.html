<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Expense Tracker</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container" style="max-width: 400px; margin-top: 80px;">
        <section class="card">
            <h2 style="margin-bottom: 20px;">Create Account</h2>
            
            {% if error %}
                <p style="color: #f87171; font-weight: bold; margin-bottom: 15px;">{{ error }}</p>
            {% endif %}

            <form action="/register" method="POST" style="display: flex; flex-direction: column; gap: 15px;">
                <div class="form-group">
                    <label for="username">Username:</label>
                    <input type="text" id="username" name="username" required style="padding: 10px; border-radius: 6px; background: #1e293b; color: #fff; border: 1px solid #334155;">
                </div>

                <div class="form-group">
                    <label for="password">Password:</label>
                    <input type="password" id="password" name="password" required style="padding: 10px; border-radius: 6px; background: #1e293b; color: #fff; border: 1px solid #334155;">
                </div>

                <button type="submit" class="btn-submit">Register</button>
            </form>

            <p style="margin-top: 20px; font-size: 0.9rem;">
                Already have an account? <a href="/login" style="color: #38bdf8; text-decoration: none;">Login here</a>
            </p>
        </section>
    </div>
</body>
</html>
